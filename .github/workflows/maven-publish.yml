name: Maven Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Tạo release kèm file .jar?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Cần để tạo release và upload asset

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # Liệt kê các jar đầu ra để đối chiếu kích thước trong log
      - name: List built JARs
        run: ls -lh target/*.jar

      - name: Create Release and Upload JARs
        if: github.event_name == 'workflow_dispatch' && inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manual-release-${{ github.run_number }}
          name: Manual Release ${{ github.run_number }}
          files: |
            target/RecheckScan.jar
            target/RecheckScan-win-x64.jar
            target/RecheckScan-linux-x64.jar
            target/RecheckScan-mac-arm64.jar
