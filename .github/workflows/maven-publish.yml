name: Maven Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Tạo release kèm file .jar?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Cần để tạo release và upload asset

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Một lần build sinh ra 4 bản .jar (xem cấu hình shade trong pom.xml):
      #   *-all.jar       : Windows/Linux/macOS trên x86_64 + aarch64
      #   *-win-x64.jar   : chỉ Windows x86_64
      #   *-linux-x64.jar : chỉ Linux x86_64
      #   *-mac-arm64.jar : chỉ macOS aarch64 (Apple Silicon)
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: List built JARs
        run: ls -lh target/*-all.jar target/*-win-x64.jar target/*-linux-x64.jar target/*-mac-arm64.jar

      - name: Upload JARs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: burp-recheck-scan-jars
          path: |
            target/*-all.jar
            target/*-win-x64.jar
            target/*-linux-x64.jar
            target/*-mac-arm64.jar
          if-no-files-found: error

      - name: Create Release and Upload JARs
        if: github.event_name == 'workflow_dispatch' && inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manual-release-${{ github.run_number }}
          name: Manual Release ${{ github.run_number }}
          files: |
            target/*-all.jar
            target/*-win-x64.jar
            target/*-linux-x64.jar
            target/*-mac-arm64.jar
